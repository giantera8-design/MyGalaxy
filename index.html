<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d20">
  <title>mygalaxy — a tiny space game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d20;
      color: #f5f4ff;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(80, 66, 160, .24), transparent 55%),
        #090d20;
    }

    .game { width: min(100%, 880px); }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 0 4px 14px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #a7a5cb;
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.45rem);
      letter-spacing: -.055em;
      line-height: 1;
    }

    h1 span { color: #ffcf70; }

    .stats { display: flex; gap: 10px; }

    .stat {
      min-width: 82px;
      padding: 9px 13px;
      border: 1px solid rgba(188, 184, 255, .13);
      border-radius: 12px;
      background: rgba(25, 29, 59, .78);
      text-align: center;
    }

    .stat-label {
      display: block;
      margin-bottom: 2px;
      color: #a7a5cb;
      font-size: .64rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .stat-value { font-size: 1.15rem; font-weight: 800; }
    #lives { color: #ff8296; letter-spacing: .08em; }

    .frame {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(188, 184, 255, .2);
      border-radius: 20px;
      background: #0c1230;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .4), 0 0 45px rgba(116, 87, 255, .1);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(7, 10, 28, .52);
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .overlay[hidden] { display: none; }

    .card { max-width: 390px; }

    .badge {
      display: inline-block;
      margin-bottom: 13px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 207, 112, .3);
      border-radius: 999px;
      background: rgba(255, 207, 112, .1);
      color: #ffcf70;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .card h2 {
      margin: 0 0 9px;
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      letter-spacing: -.05em;
    }

    .card p {
      margin: 0 auto 20px;
      color: #c1c2dc;
      line-height: 1.6;
    }

    button {
      min-height: 46px;
      padding: 0 23px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffe08b, #ffae67);
      color: #24152b;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 174, 103, .23);
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover { filter: brightness(1.08); transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .help {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin: 14px 0 0;
      color: #a7a5cb;
      font-size: .8rem;
    }

    kbd {
      padding: 3px 7px;
      border: 1px solid rgba(188, 184, 255, .2);
      border-radius: 6px;
      background: #171b38;
      color: #f5f4ff;
      font: inherit;
      font-size: .72rem;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      .topbar { align-items: center; margin-inline: 1px; }
      .stats { gap: 6px; }
      .stat { min-width: 65px; padding: 7px 8px; }
      .stat-label { font-size: .56rem; }
      .stat-value { font-size: 1rem; }
      .frame { border-radius: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="topbar">
      <div>
        <p class="eyebrow">A tiny arcade game</p>
        <h1>mygalaxy</h1>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
        <div class="stat"><span class="stat-label">Lives</span><span class="stat-value" id="lives">♥♥♥</span></div>
      </div>
    </header>

    <section class="frame" aria-label="mygalaxy game">
      <canvas id="game" width="800" height="600" aria-label="Move your ship to catch stars and dodge asteroids"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <span class="badge">Ready, space explorer?</span>
          <h2 id="message-title">Catch the stars</h2>
          <p id="message">Collect the golden stars, dodge the asteroids, and see how long you can last.</p>
          <button id="start" type="button">Start game</button>
        </div>
      </div>
    </section>

    <p class="help">
      <span><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move</span>
      <span>On mobile, drag your ship</span>
      <span>Catch <strong>✦</strong> stars · avoid asteroids</span>
    </p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const overlay = document.querySelector("#overlay");
      const startButton = document.querySelector("#start");
      const scoreDisplay = document.querySelector("#score");
      const livesDisplay = document.querySelector("#lives");
      const title = document.querySelector("#message-title");
      const message = document.querySelector("#message");
      const width = canvas.width;
      const height = canvas.height;

      let state = "ready";
      let score = 0;
      let lives = 3;
      let lastTime = 0;
      let spawnClock = 0;
      let objects = [];
      let particles = [];
      let pointerX = null;
      const keys = new Set();
      const player = { x: width / 2, y: height - 58, radius: 21, speed: 440 };
      const backgroundStars = Array.from({ length: 95 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.8 + .4,
        phase: Math.random() * Math.PI * 2
      }));

      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function resetGame() {
        score = 0;
        lives = 3;
        spawnClock = 0;
        objects = [];
        particles = [];
        player.x = width / 2;
        pointerX = null;
        scoreDisplay.textContent = score;
        livesDisplay.textContent = "♥♥♥";
        state = "playing";
        overlay.hidden = true;
        lastTime = performance.now();
      }

      function endGame() {
        state = "over";
        title.textContent = "Nice flying!";
        message.textContent = `You scored ${score} ${score === 1 ? "point" : "points"}. Ready for another run?`;
        startButton.textContent = "Play again";
        overlay.hidden = false;
      }

      function addBurst(x, y, color) {
        for (let i = 0; i < 12; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 45 + Math.random() * 150;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: .45 + Math.random() * .35,
            maxLife: .8,
            color
          });
        }
      }

      function spawnObject() {
        const isStar = Math.random() < .68;
        const radius = isStar ? 13 : 17 + Math.random() * 8;
        objects.push({
          x: radius + Math.random() * (width - radius * 2),
          y: -radius,
          radius,
          type: isStar ? "star" : "rock",
          speed: 150 + Math.min(score * 1.6, 190) + Math.random() * 65,
          spin: Math.random() * Math.PI * 2,
          spinSpeed: (Math.random() - .5) * 2.6
        });
      }

      function update(dt) {
        const movingLeft = keys.has("ArrowLeft") || keys.has("a") || keys.has("A");
        const movingRight = keys.has("ArrowRight") || keys.has("d") || keys.has("D");
        if (pointerX !== null) {
          player.x += (pointerX - player.x) * Math.min(1, dt * 12);
        } else {
          player.x += ((movingRight ? 1 : 0) - (movingLeft ? 1 : 0)) * player.speed * dt;
        }
        player.x = Math.max(player.radius + 5, Math.min(width - player.radius - 5, player.x));

        spawnClock += dt;
        const spawnEvery = Math.max(.31, .76 - score * .0025);
        if (spawnClock >= spawnEvery) {
          spawnClock = 0;
          spawnObject();
        }

        for (let i = objects.length - 1; i >= 0; i--) {
          const item = objects[i];
          item.y += item.speed * dt;
          item.spin += item.spinSpeed * dt;
          const dx = item.x - player.x;
          const dy = item.y - player.y;
          if (dx * dx + dy * dy < (item.radius + player.radius - 5) ** 2) {
            if (item.type === "star") {
              score += 10;
              scoreDisplay.textContent = score;
              addBurst(item.x, item.y, "#ffcf70");
            } else {
              lives--;
              livesDisplay.textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
              addBurst(item.x, item.y, "#ff8296");
              if (lives <= 0) {
                objects.splice(i, 1);
                endGame();
                return;
              }
            }
            objects.splice(i, 1);
          } else if (item.y - item.radius > height) {
            objects.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const particle = particles[i];
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.life -= dt;
          if (particle.life <= 0) particles.splice(i, 1);
        }
      }

      function drawStar(x, y, radius, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const angle = -Math.PI / 2 + i * Math.PI / 5;
          const r = i % 2 === 0 ? radius : radius * .44;
          const px = Math.cos(angle) * r;
          const py = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = "#ffcf70";
        ctx.shadowColor = "#ffbd55";
        ctx.shadowBlur = 17;
        ctx.fill();
        ctx.restore();
      }

      function drawShip() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.shadowColor = "#8b83ff";
        ctx.shadowBlur = 22;
        ctx.fillStyle = "#a9a0ff";
        ctx.beginPath();
        ctx.moveTo(0, -23);
        ctx.lineTo(19, 17);
        ctx.quadraticCurveTo(0, 9, -19, 17);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#f4efff";
        ctx.beginPath();
        ctx.ellipse(0, -2, 6, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffbd70";
        ctx.beginPath();
        ctx.moveTo(-7, 16);
        ctx.lineTo(0, 29 + Math.random() * 7);
        ctx.lineTo(7, 16);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#11183c");
        sky.addColorStop(1, "#17122e");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const now = performance.now() / 1000;
        for (const star of backgroundStars) {
          ctx.globalAlpha = .35 + (Math.sin(now * 1.5 + star.phase) + 1) * .25;
          ctx.fillStyle = "#d9d8ff";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const item of objects) {
          if (item.type === "star") {
            drawStar(item.x, item.y, item.radius, item.spin);
          } else {
            ctx.save();
            ctx.translate(item.x, item.y);
            ctx.rotate(item.spin);
            ctx.fillStyle = "#a56c76";
            ctx.strokeStyle = "#e28d83";
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < 9; i++) {
              const angle = i * Math.PI * 2 / 9;
              const r = item.radius * (.78 + .22 * Math.sin(i * 7.3));
              const x = Math.cos(angle) * r;
              const y = Math.sin(angle) * r;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }

        for (const particle of particles) {
          ctx.globalAlpha = Math.max(0, particle.life / particle.maxLife);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        drawShip();
      }

      function frame(time) {
        const dt = Math.min((time - lastTime) / 1000 || 0, .04);
        lastTime = time;
        if (state === "playing") update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      function moveFromPointer(event) {
        const rect = canvas.getBoundingClientRect();
        pointerX = (event.clientX - rect.left) / rect.width * width;
      }

      startButton.addEventListener("click", resetGame);
      canvas.addEventListener("pointerdown", (event) => {
        canvas.setPointerCapture(event.pointerId);
        moveFromPointer(event);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (event.pointerType === "mouse" && event.buttons === 0 && state !== "playing") return;
        if (event.pointerType !== "mouse" || event.buttons > 0) moveFromPointer(event);
      });
      canvas.addEventListener("pointerup", () => { pointerX = null; });
      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
        keys.add(event.key);
        if ((event.key === " " || event.key === "Enter") && state !== "playing") resetGame();
      });
      window.addEventListener("keyup", (event) => keys.delete(event.key));
      window.addEventListener("blur", () => keys.clear());
      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
